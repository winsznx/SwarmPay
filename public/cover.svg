<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="'Space Grotesk', 'Inter', system-ui, sans-serif">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#020617" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="#020617"/>
  <rect width="1280" height="720" fill="url(#grid)"/>
  <rect width="1280" height="720" fill="url(#bgGlow)"/>

  <!-- Particle field (decorative) -->
  <g opacity="0.5">
    <circle cx="120" cy="180" r="2" fill="#3b82f6"/>
    <circle cx="280" cy="240" r="1.5" fill="#3b82f6"/>
    <circle cx="380" cy="120" r="1" fill="#3b82f6"/>
    <circle cx="900" cy="200" r="2" fill="#3b82f6"/>
    <circle cx="1080" cy="160" r="1.5" fill="#3b82f6"/>
    <circle cx="1180" cy="280" r="1" fill="#3b82f6"/>
    <circle cx="160" cy="540" r="1.5" fill="#3b82f6"/>
    <circle cx="320" cy="600" r="1" fill="#3b82f6"/>
    <circle cx="950" cy="560" r="2" fill="#3b82f6"/>
    <circle cx="1100" cy="520" r="1.5" fill="#3b82f6"/>
    <line x1="120" y1="180" x2="280" y2="240" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
    <line x1="900" y1="200" x2="1080" y2="160" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
    <line x1="950" y1="560" x2="1100" y2="520" stroke="#3b82f6" stroke-width="0.5" opacity="0.3"/>
  </g>

  <!-- Top label -->
  <text x="640" y="160" text-anchor="middle" fill="#60a5fa" font-size="14" font-weight="900" letter-spacing="6">
    THE AGENT ECONOMY · POWERED BY ARC
  </text>

  <!-- Wordmark -->
  <text x="640" y="340" text-anchor="middle" fill="url(#wordmark)" font-size="160" font-weight="900" letter-spacing="-4" font-style="italic">
    SWARMPAY
  </text>

  <!-- Subtitle -->
  <text x="640" y="430" text-anchor="middle" fill="#94a3b8" font-size="32" font-weight="500" letter-spacing="-0.5">
    Per-action settlement infrastructure for AI agents
  </text>

  <!-- Stats row -->
  <g transform="translate(160, 510)">
    <!-- Stat 1 -->
    <g transform="translate(0, 0)">
      <text fill="#ffffff" font-size="56" font-weight="900" font-family="ui-monospace, 'SF Mono', monospace">60+</text>
      <text y="32" fill="#64748b" font-size="11" font-weight="700" letter-spacing="2">REAL ON-CHAIN SETTLEMENTS / TASK</text>
    </g>
    <!-- Stat 2 -->
    <g transform="translate(360, 0)">
      <text fill="#60a5fa" font-size="56" font-weight="900" font-family="ui-monospace, 'SF Mono', monospace">$0.027</text>
      <text y="32" fill="#64748b" font-size="11" font-weight="700" letter-spacing="2">MEASURED ARC GAS / TASK</text>
    </g>
    <!-- Stat 3 -->
    <g transform="translate(720, 0)">
      <text fill="#ffffff" font-size="56" font-weight="900" font-family="ui-monospace, 'SF Mono', monospace">x402</text>
      <text y="32" fill="#64748b" font-size="11" font-weight="700" letter-spacing="2">AGENT-TO-AGENT PAYMENT PROTOCOL</text>
    </g>
  </g>

  <!-- Bottom banner -->
  <rect x="0" y="650" width="1280" height="70" fill="#0f172a" stroke="#1e3a8a" stroke-width="1"/>
  <text x="640" y="690" text-anchor="middle" fill="#cbd5e1" font-size="16" font-weight="700" letter-spacing="1">
    60+ real on-chain settlements per task · Measured gas: ~$0.027 · Per-action agent commerce
  </text>
</svg>
